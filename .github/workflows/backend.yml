name: Backend CI

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('backend/pyproject.toml') != ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
      - run: ruff format --check
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
      - run: ruff check
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reconcile_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('backend/pyproject.toml') != ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
      - if: hashFiles('backend/pyproject.toml') != ''
        run: |
          if [ -f alembic.ini ]; then
            python -m alembic upgrade head
          fi
        working-directory: backend
      - if: hashFiles('backend/pyproject.toml') != ''
        run: |
          export DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/reconcile_test"
          export SESSION_SECRET="ci-dummy-secret"
          pytest
        working-directory: backend

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('backend/pyproject.toml') != ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
      - run: pip-audit
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: hashFiles('backend/Dockerfile') != ''
      - uses: docker/setup-buildx-action@v3
        if: hashFiles('backend/Dockerfile') != ''
      - if: hashFiles('backend/Dockerfile') != ''
        run: |
          docker build -t reconcile-backend:latest backend/
