name: Contract Check

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/contract.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Setup backend
      - uses: actions/setup-python@v5
        if: hashFiles('backend/app/openapi_export.py') != '' && hashFiles('frontend/package.json') != ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
        if: hashFiles('backend/app/openapi_export.py') != '' && hashFiles('frontend/package.json') != ''
        working-directory: backend
      
      # Setup frontend
      - uses: oven-sh/setup-bun@v2
        if: hashFiles('backend/app/openapi_export.py') != '' && hashFiles('frontend/package.json') != ''
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        if: hashFiles('backend/app/openapi_export.py') != '' && hashFiles('frontend/package.json') != ''
        working-directory: frontend
      
      # Generate OpenAPI
      - run: python -m app.openapi_export
        if: hashFiles('backend/app/openapi_export.py') != '' && hashFiles('frontend/package.json') != ''
        working-directory: backend
      
      # Generate API client
      - run: bun run gen:api
        if: hashFiles('backend/app/openapi_export.py') != '' && hashFiles('frontend/package.json') != ''
        working-directory: frontend
      
      # Check for changes
      - run: git diff --exit-code
        if: hashFiles('backend/app/openapi_export.py') != '' && hashFiles('frontend/package.json') != ''